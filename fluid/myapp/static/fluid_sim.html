<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fluid Simulation</title>
  <link rel="stylesheet" href="styl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="fluid-container">
    <div id="menu">
      <h2 class="menu-title">Choose your fighter</h2>
      <h2 class="menu-subtitle">(a.k.a. wybierz kolorek płynu)</h2>
      <button class="guzik-1"></button>
      <button class="guzik-2"></button>
      <button class="guzik-3"></button>
    </div>

    <div id="canvas-container">
      <canvas id="canvas" width="512" height="512"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const N = 64;
    const scale = 8;
    const size = N + 2;
    const dt = 0.1;
    const diff = 0.0001;
    const visc = 0.0001;

    let u = Array.from({length: size}, () => Array(size).fill(0));
    let v = Array.from({length: size}, () => Array(size).fill(0));
    let u_prev = Array.from({length: size}, () => Array(size).fill(0));
    let v_prev = Array.from({length: size}, () => Array(size).fill(0));
    let dens = Array.from({length: size}, () => Array(size).fill(0));
    let dens_prev = Array.from({length: size}, () => Array(size).fill(0));

    let colorMode = 'color1';

    function color1(d) {
      return d < 0.5 ? `rgb(${d * 2 * 255},0,0)` : `rgb(255,${(d - 0.5) * 2 * 255},0)`;
    }

    function color2(d) {
      return `rgb(
        ${Math.max(0, Math.min(255, Math.sin(d * Math.PI) * 255))},
        ${Math.max(0, Math.min(255, d > 0.2 ? Math.sin(d * Math.PI * 1.5) * 255 : 0))},
        ${Math.max(0, Math.min(255, d > 0.5 ? Math.cos(d * Math.PI * 1.5) * 255 : 0))}
      )`;
    }

    function color3(d) {
      return `rgb(
        ${Math.max(0, Math.min(255, Math.sin(d * Math.PI) * 255))},
        ${Math.max(0, Math.min(255, Math.sin(d * Math.PI * 2) * 127 + 128))},
        ${Math.max(0, Math.min(255, Math.cos(d * Math.PI) * 255))}
      )`;
    }

    function getColor(d) {
      if (colorMode === 'color1') return color1(d);
      if (colorMode === 'color2') return color2(d);
      return color3(d);
    }

    function setColorMode(mode) {
      colorMode = mode;
    }

    function set_bnd(b, x) {
      for (let i = 1; i <= N; i++) {
        x[0][i] = b === 1 ? -x[1][i] : x[1][i];
        x[N + 1][i] = b === 1 ? -x[N][i] : x[N][i];
        x[i][0] = b === 2 ? -x[i][1] : x[i][1];
        x[i][N + 1] = b === 2 ? -x[i][N] : x[i][N];
      }
      x[0][0] = 0.5 * (x[1][0] + x[0][1]);
      x[0][N + 1] = 0.5 * (x[1][N + 1] + x[0][N]);
      x[N + 1][0] = 0.5 * (x[N][0] + x[N + 1][1]);
      x[N + 1][N + 1] = 0.5 * (x[N][N + 1] + x[N + 1][N]);
    }

    function diffuse(b, x, x0, diff, dt) {
      const a = dt * diff * N * N;
      for (let k = 0; k < 20; k++) {
        for (let i = 1; i <= N; i++) {
          for (let j = 1; j <= N; j++) {
            x[i][j] = (x0[i][j] + a * (
              x[i - 1][j] + x[i + 1][j] + x[i][j - 1] + x[i][j + 1])) / (1 + 4 * a);
          }
        }
        set_bnd(b, x);
      }
    }

    function advect(b, d, d0, u, v, dt) {
      const dt0 = dt * N;
      for (let i = 1; i <= N; i++) {
        for (let j = 1; j <= N; j++) {
          let x = i - dt0 * u[i][j];
          let y = j - dt0 * v[i][j];
          x = Math.max(0.5, Math.min(N + 0.5, x));
          y = Math.max(0.5, Math.min(N + 0.5, y));
          const i0 = Math.floor(x), j0 = Math.floor(y);
          const i1 = i0 + 1, j1 = j0 + 1;
          const s1 = x - i0, t1 = y - j0;
          const s0 = 1 - s1, t0 = 1 - t1;
          d[i][j] =
            s0 * (t0 * d0[i0][j0] + t1 * d0[i0][j1]) +
            s1 * (t0 * d0[i1][j0] + t1 * d0[i1][j1]);
        }
      }
      set_bnd(b, d);
    }

    function step() {
      diffuse(1, u_prev, u, visc, dt);
      diffuse(2, v_prev, v, visc, dt);
      advect(1, u, u_prev, u_prev, v_prev, dt);
      advect(2, v, v_prev, u_prev, v_prev, dt);

      diffuse(0, dens_prev, dens, diff, dt);
      advect(0, dens, dens_prev, u, v, dt);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 1; i <= N; i++) {
        for (let j = 1; j <= N; j++) {
          let d = Math.max(0, Math.min(1, dens[i][j]));
          ctx.fillStyle = getColor(d);
          ctx.fillRect((i - 1) * scale, (j - 1) * scale, scale, scale);
        }
      }
    }

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) {
        let i = Math.floor(e.offsetX / scale) + 1;
        let j = Math.floor(e.offsetY / scale) + 1;
        if (i > 0 && i <= N && j > 0 && j <= N) {
          dens[i][j] += 1;
          u[i][j] += (Math.random() - 0.5) * 2;
          v[i][j] += (Math.random() - 0.5) * 2;
        }
      }
    });

    function animate() {
      step();
      draw();
      requestAnimationFrame(animate);
    }

    animate();

    const buttons = document.querySelectorAll('.guzik-1, .guzik-2, .guzik-3');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        // Ustaw kolor zależnie od guzika
        if (button.classList.contains('guzik-1')) setColorMode('color1');
        if (button.classList.contains('guzik-2')) setColorMode('color2');
        if (button.classList.contains('guzik-3')) setColorMode('color3');

        // Dodaj efekt kliknięcia
        button.classList.add('clicked');
        setTimeout(() => {
          button.classList.remove('clicked');
        }, 100);
      });
    });
  </script>
</body>
</html>
